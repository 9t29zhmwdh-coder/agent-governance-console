version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # rand exists here for one line: giving rsa 0.9 a random source when a
      # test generates an RSA keypair, so that a real RS256 token can be
      # verified against a mock JWKS server.
      #
      # rsa 0.9 expects CryptoRngCore from rand_core 0.6. Under rand 0.10,
      # ThreadRng implements the rand_core 0.9 traits instead and the test
      # stops compiling:
      #
      #   the trait bound `ThreadRng: CryptoRngCore` is not satisfied
      #
      # An rsa release that would resolve this exists only as 0.10.0-rc, and
      # pulling a release candidate into a governance console to satisfy a
      # version number in a test is the wrong trade. Proposed once and closed
      # in #51 before this entry was added.
      #
      # The bound was >= 0.10 at first, which was too narrow: rand 0.9 already
      # sits on rand_core 0.9 and fails identically, measured rather than
      # assumed after Dependabot proposed it as #61. Only 0.8.x remains
      # reachable, so a patch or minor release inside 0.8 would still be
      # proposed. Remove this block once rsa 0.10 is stable, which is the
      # condition recorded next to the declaration in agc-api/Cargo.toml.
      - dependency-name: "rand"
        versions: [">= 0.9"]
